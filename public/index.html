<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seller Shield</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    input, button { padding: .5rem; font-size: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    .badge { padding: 2px 8px; border-radius: 8px; color: #fff; font-weight: 600; }
    .LOW, .approved { background: #2e7d32; }
    .MEDIUM { background: #ef6c00; }
    .HIGH, .held { background: #c62828; }
    .pending { background: #757575; }
    .actions { margin-top: 4px; }
    .actions button { margin: 2px 4px 2px 0; cursor: pointer; }
    .actions a { margin-right: 8px; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>Seller Shield</h1>
  <p>Simulate an incoming order. It creates a real PayPal sandbox order and scores its risk.</p>

  <form id="orderForm">
    <input name="amount" type="number" step="0.01" placeholder="Amount (USD)" required />
    <input name="buyerCountry" maxlength="2" placeholder="Buyer country (PH)" required />
    <input name="shipCountry" maxlength="2" placeholder="Ship-to country (PH)" required />
    <button type="submit">Create order</button>
  </form>
  <p id="msg"></p>

  <table>
    <thead>
      <tr><th>Time</th><th>Order ID</th><th>Amount</th><th>Buyer / Ship</th><th>Risk</th><th>Decision</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function riskCell(o) {
      if (!o.risk) return '<small>-</small>';
      const ai = o.risk.aiSummary;
      return `<span class="badge ${o.risk.level}">${o.risk.level} (${o.risk.score})</span>` +
        (ai
          ? `<br><strong>Suggested: ${esc(ai.recommendation)}</strong>
             <br><small>${esc(ai.explanation)}</small>
             <br><small><em>(${ai.source === 'ai' ? 'AI analysis' : 'rule-based'})</em></small>`
          : `<br><small>${o.risk.reasons.map(esc).join('<br>') || 'No issues found'}</small>`);
    }

    function decisionCell(o) {
      if (!o.risk) return '<small>-</small>';
      const status = o.status || 'pending';
      const captured = o.paypalStatus === 'COMPLETED';
      const id = esc(o.id);

      let extra = '';
      if (status === 'approved') {
        if (captured) {
          extra = `<div><small>Payment captured${o.captureId ? ' (' + esc(o.captureId) + ')' : ''}</small></div>`;
        } else {
          extra = `<div><small>${esc(o.captureMessage || 'Capture not attempted yet.')}</small></div>
            <div class="actions">
              ${o.approveUrl ? `<a href="${esc(o.approveUrl)}" target="_blank" rel="noopener">Open buyer approval</a>` : ''}
              <button data-id="${id}" data-capture="1">Retry capture</button>
            </div>`;
        }
      }

      const approveBtn = status !== 'approved'
        ? `<button data-id="${id}" data-decision="approved">Approve</button>` : '';
      const holdBtn = status !== 'held' && !captured
        ? `<button data-id="${id}" data-decision="held">Hold</button>` : '';

      return `<span class="badge ${status}">${status.toUpperCase()}</span>
              ${extra}
              <div class="actions">${approveBtn}${holdBtn}</div>`;
    }

    async function load() {
      const orders = await (await fetch('/api/orders')).json();
      document.getElementById('rows').innerHTML = orders.map(o => `
        <tr>
          <td>${new Date(o.createdAt).toLocaleString()}</td>
          <td>${esc(o.id)}<br><small>${esc(o.paypalStatus || 'historical')}</small></td>
          <td>$${Number(o.amount).toFixed(2)}</td>
          <td>${esc(o.buyerCountry)} / ${esc(o.shipCountry)}</td>
          <td>${riskCell(o)}</td>
          <td>${decisionCell(o)}</td>
        </tr>`).join('');
    }

    // Approve / Hold / Retry capture button clicks
    document.getElementById('rows').addEventListener('click', async e => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      btn.disabled = true;

      const id = encodeURIComponent(btn.dataset.id);
      const isCapture = !!btn.dataset.capture;
      const res = await fetch(
        isCapture ? `/api/orders/${id}/capture` : `/api/orders/${id}/decision`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(isCapture ? {} : { decision: btn.dataset.decision }),
        }
      );
      if (!res.ok) {
        const data = await res.json();
        document.getElementById('msg').textContent = 'Error: ' + data.error;
      } else {
        document.getElementById('msg').textContent = '';
      }
      load();
    });

    document.getElementById('orderForm').addEventListener('submit', async e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const submit = e.target.querySelector('button');
      submit.disabled = true;
      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        document.getElementById('msg').textContent = res.ok ? '' : 'Error: ' + data.error;
      } finally {
        submit.disabled = false;
      }
      load();
    });

    load();
  </script>
</body>
</html>
